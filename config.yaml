# =========================================================
# Configuração — PBIL-Fuzzy para NPFS
# Valores iniciais calibrados por regra heurística para validar e executar
# o PBIL-Fuzzy ponta a ponta. Podem ser refinados experimentalmente.
# =========================================================

instancia:
  diretorio_small: "data/instances/Small"
  diretorio_large: "data/instances/Large"
  diretorio_custom: "data/instances/custom"

pbil:
  n_pop: 80
  valor_inicial_matriz_p: 0.5    # decidido: todas as células de P começam em 0.5
  distribuicao_amostragem: "normal_truncada"
  sigma_amostragem: 0.25

diversidade:
  pct_elite: 0.08
  pct_subelite: 0.35
  delta: 0.20
  preenchimento_insuficiente: "amostrar_extra_de_p"

fuzzy:
  motor_inferencia: "mamdani"
  metodo_defuzzificacao: "centroide"
  combinacao_q_sigma_rel: "media_ponderada"
  pesos_progresso_qualidade:
    q: 0.80
    sigma_rel: 0.20
  tratamento_estagnacao: "fora_do_fuzzy"
  limiar_muito_proximo_override: 0.05

  termos_progresso_qualidade:
    - "muito_distante"
    - "distante"
    - "moderado"
    - "proximo"
    - "muito_proximo"

  termos_diversidade:
    - "baixa"
    - "media"
    - "alta"

  pertinencia:
    formato: "triangular"
    limiares_progresso_qualidade: [0.05, 0.15, 0.35, 0.65]
    limiares_diversidade: [0.25, 0.60]

criterio_parada:
  tipo: "numero_geracoes"
  max_geracoes: 300
  geracoes_estagnacao_limite: 40

execucao:
  seed: 42
  n_execucoes_por_instancia: 30
  salvar_logs: true
  salvar_plots: true

caminhos:
  logs: "data/results/logs"
  outputs: "data/results/outputs"
  plots: "data/results/plots"
